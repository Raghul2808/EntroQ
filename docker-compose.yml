services:
  qrng-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qrng-instrument
    ports:
      - "8000:8000"
    environment:
      - MPLBACKEND=Agg
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
